<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christofin Impex — Order Tracking Dashboard</title>
<meta name="description" content="Christofin Impex order to delivery tracking dashboard">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#10233f">
<style>
  :root{
    --bg:#f1f5f9; --surface:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#d5deea; --line2:#f1f5f9;
    --navy:#10233f; --navy2:#1b3a63; --brand:#db2777;
    --blue:#2563eb; --blue-bg:#eff6ff; --red:#dc2626; --red-bg:#fef2f2; --amber:#d97706; --amber-bg:#fffbeb; --green:#16a34a; --green-bg:#f0fdf4;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06);
    --shadow-lg:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#cfdcf0 0,#dfe8f5 300px,#e6edf7 100%) no-repeat,#e6edf7;color:var(--ink);min-height:100vh;font-size:14px;line-height:1.45}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent}

  /* HEADER */
  .header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:0 28px;height:72px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(16,35,63,.35)}
  .header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand),#f472b6 50%,transparent)}
  .logo-wrap img{height:48px;width:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);background:#fff;display:block}
  .brand h1{font-size:1.15rem;font-weight:700;letter-spacing:.2px;line-height:1.2}
  .brand p{font-size:.76rem;color:#b6c4d9;letter-spacing:.4px;text-transform:uppercase;margin-top:1px}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .sync-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;font-size:.78rem;color:#e2e8f0}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .sync-dot.live{background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

  /* BUTTONS */
  .btn{background:var(--brand);color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:600;transition:.15s}
  .btn:hover{background:#be185d;transform:translateY(-1px)}
  .btn-sec{background:#eef2f7;color:var(--ink2)}
  .btn-sec:hover{background:#e2e8f0}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);padding:7px 14px;border-radius:999px;font-size:.78rem;font-weight:600}
  .btn-ghost:hover{background:rgba(255,255,255,.22);transform:none}

  /* SETUP */
  #setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px;max-width:560px;margin:60px auto;box-shadow:var(--shadow-lg)}
  #setup h2{font-size:1.1rem;font-weight:700;margin-bottom:18px}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .form-row label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .form-row input{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink);font-size:.9rem;width:100%}
  .form-row input:focus{outline:2px solid rgba(219,39,119,.35);border-color:var(--brand);background:#fff}
  .setup-hint{font-size:.76rem;color:var(--muted)}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:16px;padding:28px;width:90%;max-width:520px;box-shadow:var(--shadow-lg)}
  .modal h2{font-size:1.05rem;font-weight:700;margin-bottom:16px}

  /* MAIN */
  #main{padding:26px 28px 40px;max-width:1500px;margin:0 auto}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .section-head h2{font-size:1.05rem;font-weight:700;color:var(--ink)}
  .section-head span{font-size:.78rem;color:var(--muted)}

  /* STATUS CARDS */
  .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}
  .kpi{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden;color:inherit}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .kpi:focus-visible{outline:3px solid rgba(37,99,235,.4)}
  .kpi .top{display:flex;align-items:center;justify-content:space-between}
  .kpi .lbl{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .kpi .ico{width:34px;height:34px;border-radius:10px;background:var(--cbg);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700}
  .kpi .num{font-size:2.1rem;font-weight:800;line-height:1.1;margin-top:10px;color:var(--ink)}
  .kpi .sub{font-size:.74rem;color:var(--muted);margin-top:4px}
  .kpi.total{--c:var(--navy2);--cbg:#e8eef7}
  .kpi.prog{--c:var(--blue);--cbg:var(--blue-bg)}
  .kpi.delayed{--c:var(--red);--cbg:var(--red-bg)}
  .kpi.hold{--c:var(--amber);--cbg:var(--amber-bg)}
  .kpi.done{--c:var(--green);--cbg:var(--green-bg)}
  .kpi.can{display:none}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:700;font-size:.9rem;padding:10px 20px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .tab .tc{background:#e2e8f0;border-radius:999px;font-size:.75rem;padding:2px 9px}
  .tab.active{background:var(--navy,#10233f);color:#fff;border-color:var(--navy,#10233f)}
  .tab.active .tc{background:rgba(255,255,255,.2)}
  .tab.xc.active{background:#475569;border-color:#475569}
  .badge.can{background:#f1f5f9;color:#475569}
  .btn-cancel{border:1px solid #fecaca;background:#fff;color:var(--red);font-weight:700;font-size:.74rem;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .btn-cancel:hover{background:var(--red);color:#fff}
  .btn-cancel:disabled,.btn-cancel:disabled:hover{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0;cursor:not-allowed}
  .cx-box{background:#fff;border:1px solid var(--line);border-left:4px solid #64748b;border-radius:12px;padding:14px 16px;display:grid;gap:8px}
  .cx-box h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .cx-row{font-size:.86rem;color:var(--ink2);line-height:1.5}
  .cx-row b{color:var(--ink)}
  .cx-remark{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
  .modal h3{font-size:1.1rem;color:var(--red);margin-bottom:6px}
  .modal p{font-size:.86rem;color:var(--ink2);margin-bottom:12px;line-height:1.45}
  .modal label{display:block;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px}
  .modal input,.modal textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:.9rem}
  .modal textarea{min-height:90px;resize:vertical}
  .modal .err{color:var(--red);font-size:.8rem;margin-top:8px;min-height:1em}
  .modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  .modal .btns button{border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.86rem;cursor:pointer}
  .modal .b-no{background:#e2e8f0;color:var(--ink)}
  .modal .b-yes{background:var(--red);color:#fff}
  .modal .b-yes:disabled{opacity:.6;cursor:wait}
  .kpi.active{border-color:var(--c);background:var(--cbg);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),var(--shadow-lg);transform:translateY(-2px)}
  .kpi.active .sub{color:var(--c);font-weight:600}

  /* FILTER BAR */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:16px 20px;margin-bottom:16px}
  .f-group{display:flex;flex-direction:column;gap:5px}
  .f-group.grow{flex:1;min-width:220px}
  .f-group label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .filters input,.filters select{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:.86rem;font-family:inherit;min-height:40px}
  .filters input:focus,.filters select:focus{outline:2px solid rgba(37,99,235,.3);border-color:var(--blue);background:#fff}
  .refresh-info{margin-left:auto;font-size:.76rem;color:var(--muted);align-self:center}

  /* ACTIVE VIEW BAR */
  .viewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;min-height:36px}
  .viewbar .vtitle{font-size:1rem;font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--cbg,#e8eef7);color:var(--c,var(--navy2));border:1px solid color-mix(in srgb,var(--c,var(--navy2)) 30%,transparent)}
  .back-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink2);padding:8px 16px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
  .back-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

  .v-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn-export{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:9px 16px;font-size:.82rem;font-weight:700;cursor:pointer;color:#fff;box-shadow:var(--shadow);transition:.15s}
  .btn-export:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
  .btn-export.xl{background:#15803d}.btn-export.xl:hover{background:#166534}
  .btn-export.pdf{background:#b91c1c}.btn-export.pdf:hover{background:#991b1b}

  /* TABLE */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:900px}
  thead th{position:sticky;top:0;background:#eef3fa;padding:12px 16px;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:13px 16px;font-size:.86rem;border-bottom:1px solid var(--line2);vertical-align:middle}
  tr.data-row{transition:background .12s}
  tr.data-row:hover td{background:#f8fafc;cursor:pointer}
  tr.data-row.open td{background:#f8fafc}
  .party{font-weight:600;color:var(--ink)}
  .muted{color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.done{background:var(--green-bg);color:var(--green)}
  .badge.prog,.badge.pend{background:var(--blue-bg);color:var(--blue)}
  .badge.del{background:var(--red-bg);color:var(--red)}
  .badge.hold{background:var(--amber-bg);color:var(--amber)}
  .prog-cell{display:flex;align-items:center;gap:10px}
  .stage-mini{display:flex;gap:3px}
  .s-dot{width:14px;height:8px;border-radius:3px;background:#e2e8f0}
  .s-dot.done{background:var(--green)}
  .s-dot.prog{background:var(--blue)}
  .s-dot.del{background:var(--red)}
  .s-dot.hold{background:var(--amber)}
  .prog-n{font-size:.74rem;color:var(--muted);font-weight:600;min-width:34px}
  .stage-now{font-size:.8rem;color:var(--ink2)}

  /* EXPAND */
  tr.expand-row td{padding:0;background:#f8fafc;border-bottom:1px solid var(--line)}
  .expand-inner{padding:20px 24px;display:grid;gap:16px}
  .stage-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
  .stage-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-left:4px solid #cbd5e1;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .stage-card.done{border-left-color:var(--green)}
  .stage-card.prog{border-left-color:var(--blue)}
  .stage-card.del{border-left-color:var(--red)}
  .stage-card.hold{border-left-color:var(--amber)}
  .stage-card .s-name{font-size:.84rem;font-weight:700;color:var(--ink)}
  .stage-card .s-who{font-size:.74rem;color:var(--muted);margin:2px 0 8px}
  .stage-card .s-row{font-size:.74rem;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:8px}
  .stage-card .s-row span{color:var(--ink2);font-weight:500;text-align:right}
  .remark-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
  .remark-box label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px}
  .remark-box textarea{width:100%;background:#f8fafc;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:.86rem;padding:10px 12px;resize:vertical;min-height:70px;font-family:inherit}
  .remark-box textarea:focus{outline:2px solid rgba(37,99,235,.3);border-color:var(--blue);background:#fff}
  .remark-footer{display:flex;align-items:center;gap:12px;margin-top:10px}
  .remark-footer select{background:#f8fafc;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;font-size:.82rem}
  .save-btn{background:var(--navy2);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600}
  .save-btn:hover{background:var(--navy)}
  .save-ok{font-size:.78rem;color:var(--green);font-weight:600;display:none}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty b{display:block;font-size:1rem;color:var(--ink2);margin-bottom:4px}
  .error-bar{background:var(--red-bg);border:1px solid #fecaca;border-radius:12px;padding:12px 18px;color:var(--red);font-size:.84rem;font-weight:500;margin-bottom:16px;display:none}
  .loading{text-align:center;padding:70px 20px;color:var(--muted)}
  .spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:720px){
    .header{padding:0 14px;height:64px} .brand p{display:none}
    #main{padding:16px 12px 30px}
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:10px}
    .kpi .num{font-size:1.7rem}
    .filters{padding:14px}
    .refresh-info{margin-left:0;width:100%}
    .sync-badge span{display:none}
  }
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-wrap"><img id="logoImg" src="" alt="Christofin Impex Logo"></div>
  <div class="brand">
    <h1>Christofin Impex</h1>
    <p>Order to Delivery Dashboard</p>
  </div>
  <div class="header-right">
    <div class="sync-badge"><div class="sync-dot" id="syncDot"></div><span id="syncLbl">Not connected</span></div>
  </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="main">
  <div class="error-bar" id="errBar"></div>

  <div class="section-head"><h2>Order Overview</h2><span>Click a card to view its orders</span></div>
  <div class="tabs">
    <button class="tab" id="tabOrders" onclick="setStatusFilter('')">Orders <span class="tc" id="tcOrders">0</span></button>
    <button class="tab xc" id="tabCan" onclick="showCancelledTab()">Cancelled Orders <span class="tc" id="tcCan">0</span></button>
  </div>
  <div class="kpi-row" id="kpiRow">
    <button class="kpi total" id="cardAll" onclick="setStatusFilter('')">
      <div class="top"><span class="lbl">All Orders</span><span class="ico">&#9776;</span></div>
      <div class="num" id="kTotal">—</div><div class="sub">Overall view</div>
    </button>
    <button class="kpi prog" id="cardProg" onclick="setStatusFilter('prog')">
      <div class="top"><span class="lbl">In Progress</span><span class="ico">&#8635;</span></div>
      <div class="num" id="kProg">—</div><div class="sub">Currently running</div>
    </button>
    <button class="kpi delayed" id="cardDel" onclick="setStatusFilter('del')">
      <div class="top"><span class="lbl">Delayed</span><span class="ico">!</span></div>
      <div class="num" id="kDel">—</div><div class="sub">Past planned time</div>
    </button>
    <button class="kpi hold" id="cardHold" onclick="setStatusFilter('hold')">
      <div class="top"><span class="lbl">On Hold</span><span class="ico">&#10074;&#10074;</span></div>
      <div class="num" id="kHold">—</div><div class="sub">Waiting / paused</div>
    </button>
    <button class="kpi done" id="cardDone" onclick="setStatusFilter('done')">
      <div class="top"><span class="lbl">Completed</span><span class="ico">&#10003;</span></div>
      <div class="num" id="kDone">—</div><div class="sub">All stages done</div>
    </button>
    <button class="kpi can" id="cardCan" onclick="setStatusFilter('can')">
      <div class="top"><span class="lbl">Cancelled</span><span class="ico">&#10005;</span></div>
      <div class="num" id="kCan">—</div><div class="sub">Order cancelled</div>
    </button>
  </div>

  <div class="panel filters">
    <div class="f-group grow"><label>Search</label><input type="text" id="fSearch" placeholder="Order / party name, city, phone…" oninput="renderTable()"></div>
    <div class="f-group"><label>From date</label><input type="date" id="fFrom" onchange="renderTable()"></div>
    <div class="f-group"><label>To date</label><input type="date" id="fTo" onchange="renderTable()"></div>
    <div class="f-group"><label>Sort by</label>
      <select id="fSort" onchange="renderTable()">
        <option value="row-desc">Newest first</option>
        <option value="row-asc">Oldest first</option>
        <option value="del-first">Delayed first</option>
      </select>
    </div>
    <span class="refresh-info" id="refreshInfo">—</span>
  </div>

  <div class="viewbar" id="viewBar"></div>

  <div class="panel" style="overflow:hidden">
    <div id="tableArea"><div class="loading"><div class="spinner"></div><br>Loading orders…</div></div>
  </div>
</div>

<div class="modal-bg" id="cxModal" onclick="if(event.target===this)closeCancel()">
  <div class="modal" role="dialog" aria-modal="true">
    <h3>Cancel this order?</h3>
    <p id="cxInfo"></p>
    <label for="cxBy">Your name *</label>
    <input type="text" id="cxBy" maxlength="60" placeholder="Name of person cancelling" autocomplete="name">
    <label for="cxRemark">Cancellation remark *</label>
    <textarea id="cxRemark" maxlength="500" placeholder="Reason for cancelling this order"></textarea>
    <div class="err" id="cxErr"></div>
    <div class="btns"><button class="b-no" onclick="closeCancel()">No, keep order</button><button class="b-yes" id="cxYes" onclick="confirmCancel()">Yes, cancel order</button></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  STAGE DEFINITIONS  (0-based column indices)
// ═══════════════════════════════════════════════════
const STAGES = [
  { id:0, name:'Order Printout',             who:'Anuj',                        leadMs:1*3600000,   pIdx:7,  aIdx:8,  sIdx:9  },
  { id:1, name:'Confirm Order',              who:'Anuj',                        leadMs:3*3600000,   pIdx:11, aIdx:12, sIdx:13 },

// ═══════════════════════════════════════════════════
//  INIT — auto-connect, no configuration screen
// ═══════════════════════════════════════════════════
(function init(){
  document.getElementById('logoImg').src = 'data:image/jpeg;base64,' + LOGO_B64;
  var ic=document.createElement('link'); ic.rel='icon'; ic.href='data:image/jpeg;base64,'+LOGO_B64; document.head.appendChild(ic);
  scriptUrl = IN_GAS ? 'gas' : DEFAULT_URL;
  document.getElementById('syncLbl').textContent = 'Connecting…';
  document.getElementById('main').style.display = 'block';
  loadData();
  startAutoRefresh();
})();

// ═══════════════════════════════════════════════════
//  AUTO-REFRESH
// ═══════════════════════════════════════════════════
function startAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(function(){ if(!previewMode) loadData(); }, 10000);
}

// ═══════════════════════════════════════════════════
//  DATA LOAD (fetch → JSONP fallback)
// ═══════════════════════════════════════════════════
function loadData(){
  if(previewMode){ loadSampleData(); return; }
  document.getElementById('errBar').style.display = 'none';

  if(IN_GAS){
    google.script.run
      .withSuccessHandler(function(txt){
        var payload = JSON.parse(txt);
        if(payload.ok){
          processPayload(payload); setSyncLive();
          document.getElementById('refreshInfo').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
        } else showErr('API error: ' + (payload.error||'Unknown'));
      })
      .withFailureHandler(function(err){ showErr('Error: ' + (err && err.message || err)); })
      .getDashboardData();
    return;
  }

  fetch(scriptUrl + (scriptUrl.indexOf('?')>-1?'&':'?') + 'api=1&_=' + Date.now()).then(function(r){return r.json();}).then(function(payload){
      if(payload.ok){ processPayload(payload); setSyncLive(); document.getElementById('refreshInfo').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN'); }
      else showErr('API error: ' + (payload.error||'Unknown'));
    }).catch(function(){ loadJsonp(); });
}

function loadJsonp(){
  cbIdx++;
  var cbName = '__dashCb' + cbIdx;
  var s = document.createElement('script');
  var timer = setTimeout(function(){
    showErr('Timeout. Check URL and re-deploy as Web App -> Anyone.');
    if(window[cbName]) delete window[cbName];
    if(s.parentNode) s.parentNode.removeChild(s);
  }, 15000);
  window[cbName] = function(payload){
    clearTimeout(timer);
    if(s.parentNode) s.parentNode.removeChild(s);
    delete window[cbName];
    if(payload.ok){
      processPayload(payload); setSyncLive();
      document.getElementById('refreshInfo').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
    } else showErr('API error: ' + (payload.error||'Unknown'));
  };
  s.src = scriptUrl + '?cb=' + cbName + '&_=' + Date.now();
  document.head.appendChild(s);
}

function showErr(msg){
  // staff-friendly message; the 10-second sync keeps retrying automatically
  var el = document.getElementById('errBar');
  el.textContent = 'Unable to load the latest data right now. Retrying automatically\u2026';
  el.style.display = 'block';
  document.getElementById('syncDot').classList.remove('live');
  document.getElementById('syncLbl').textContent = 'Reconnecting\u2026';
  if(window.console) console.warn('Dashboard load issue:', msg);
}

function setSyncLive(){

  var d = document.getElementById('syncDot');
  d.classList.add('live');
  document.getElementById('syncLbl').textContent = 'Live';

// ═══════════════════════════════════════════════════
//  PROCESS PAYLOAD
// ═══════════════════════════════════════════════════
function processPayload(payload){
  remarksMap = {};
  (payload.remarks||[]).forEach(function(r){
    remarksMap[r.rowIndex] = { remark: r.remark, holdStatus: r.holdStatus };
  });
  var serverCancel = {};
  (payload.cancellations||[]).forEach(function(c){ serverCancel[c.key] = c; });
  Object.keys(serverCancel).forEach(function(k){ delete localCancel[k]; });
  cancelMap = {};
  Object.keys(serverCancel).forEach(function(k){ cancelMap[k] = serverCancel[k]; });
  Object.keys(localCancel).forEach(function(k){ cancelMap[k] = localCancel[k]; });
  var rows = payload.data || [];
  allOrders = [];
  for(var i=6; i<rows.length; i++){
    var row = rows[i];
    if(!row[0] && !row[1] && !row[2]) continue;
    allOrders.push({ rowIndex: i+1, row: row, key: orderKey(row) });
  }
  updateKPIs();
  renderTable();
}

// ═══════════════════════════════════════════════════
//  STAGE STATUS
// ═══════════════════════════════════════════════════
function getStageStatus(row, stage){
  var sVal = (row[stage.sIdx]||'').toString().trim().toLowerCase();
  var pVal = row[stage.pIdx]||'';
  var aVal = row[stage.aIdx]||'';
  if(sVal==='hold'||sVal==='on hold') return 'hold';
  if(sVal==='done'||sVal==='yes') return 'done';
  if(stage.noMeansDone && sVal==='no') return 'done';
  if(aVal) return 'done';
  if(!pVal) return 'pend';
  // check delayed
  var now = Date.now();
  var planned = parseDate(pVal);
  if(planned && planned < now) return 'del';
  return 'prog';
}

function parseDate(v){
  if(!v) return null;
  var s = v.toString().trim();
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)).getTime();
  var d = Date.parse(s);
  return isNaN(d) ? null : d;
}

function orderKey(row){ return String(row[0]==null?'':row[0]) + '|' + String(row[2]==null?'':row[2]); }

function getOrderStatus(row, rowIndex){
  var rmk = remarksMap[rowIndex];
  if(rmk && rmk.holdStatus==='hold') return 'hold';
  var statuses = STAGES.map(function(s){ return getStageStatus(row,s); });
  if(statuses.every(function(s){ return s==='done'; })) return 'done';
  if(statuses.some(function(s){ return s==='hold'; })) return 'hold';
  if(statuses.some(function(s){ return s==='del'; })) return 'del';
  if(statuses.some(function(s){ return s==='prog'||s==='done'; })) return 'prog';
  return 'pend';
}

//  KPIs / STATUS CARDS / FILTERING
// ═══════════════════════════════════════════════════
var statusFilter = '';   // '' = all orders | 'prog' | 'del' | 'hold' | 'done'
var STATUS_META = {
  prog:{label:'In Progress', cls:'prog'},
  del :{label:'Delayed',     cls:'delayed'},
  hold:{label:'On Hold',     cls:'hold'},
  done:{label:'Completed',   cls:'done'},
  can :{label:'Cancelled',   cls:'can'}
};
var CARD_IDS = {'':'cardAll', prog:'cardProg', del:'cardDel', hold:'cardHold', done:'cardDone', can:'cardCan'};

function bucket(st){ return st==='pend' ? 'prog' : st; }   // not-started counts as In Progress

function showCancelledTab(){ statusFilter='can'; expandedRow=null; renderTable(); }
function setStatusFilter(s){
  statusFilter = (s && statusFilter===s) ? '' : (s||'');   // clicking the active card again = back to all
  expandedRow = null;
  renderTable();
}

function updateKPIs(){ renderTable(); }
function clearFilters(){ document.getElementById('fSearch').value=''; document.getElementById('fFrom').value=''; document.getElementById('fTo').value=''; renderTable(); }

function orderDateMs(row){ return parseDate(row[1]) || parseDate(row[0]); }

function currentStageName(row){
  for(var i=0;i<STAGES.length;i++){
    if(getStageStatus(row,STAGES[i])!=='done') return STAGES[i].name;
  }
  return 'All stages complete';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ═══════════════════════════════════════════════════
//  RENDER TABLE
// ═══════════════════════════════════════════════════
function renderTable(){
  var search = (document.getElementById('fSearch').value||'').toLowerCase();
  var fFrom  = document.getElementById('fFrom').value;
  var fTo    = document.getElementById('fTo').value;
  var fSort  = document.getElementById('fSort').value;
  var fromMs = fFrom ? new Date(fFrom+'T00:00:00').getTime() : null;
  var toMs   = fTo   ? new Date(fTo  +'T23:59:59').getTime() : null;

  // 1) search + date filters (status cards count within these)
  var base = allOrders.filter(function(o){
    if(search && o.row.join(' ').toLowerCase().indexOf(search)===-1) return false;
    if(fromMs!==null || toMs!==null){
      var d = orderDateMs(o.row);
      if(d){
        if(fromMs!==null && d < fromMs) return false;
        if(toMs!==null   && d > toMs)   return false;
      }
    }
    return true;
  });

  // 2) counts for the cards
  var counts = {prog:0, del:0, hold:0, done:0, can:0};
  base.forEach(function(o){ o.st = cancelMap[o.key] ? 'can' : bucket(getOrderStatus(o.row, o.rowIndex)); counts[o.st]++; });
  var activeTotal = base.length - counts.can;      // cancelled orders are not part of All Orders
  document.getElementById('kTotal').textContent = activeTotal;
  document.getElementById('kCan').textContent   = counts.can;
  document.getElementById('tcCan').textContent  = counts.can;
  document.getElementById('tcOrders').textContent = activeTotal;
  document.getElementById('tabCan').classList.toggle('active', statusFilter==='can');
  document.getElementById('tabOrders').classList.toggle('active', statusFilter!=='can');
  document.getElementById('kpiRow').style.display = statusFilter==='can' ? 'none' : '';
  document.getElementById('kProg').textContent  = counts.prog;
  document.getElementById('kDel').textContent   = counts.del;
  document.getElementById('kHold').textContent  = counts.hold;
  document.getElementById('kDone').textContent  = counts.done;
  Object.keys(CARD_IDS).forEach(function(k){
    document.getElementById(CARD_IDS[k]).classList.toggle('active', k===statusFilter);
  });

  // 3) rows for the active view (status card + search + dates), sorted
  var filtered = statusFilter ? base.filter(function(o){ return o.st===statusFilter; }) : base.filter(function(o){ return o.st!=='can'; });
  filtered.sort(function(a,b){
    if(fSort==='del-first'){
      var sa = a.st==='del'?0:1, sb = b.st==='del'?0:1;
      if(sa!==sb) return sa-sb;
    }
    if(fSort==='row-asc') return a.rowIndex - b.rowIndex;
    return b.rowIndex - a.rowIndex;
  });
  lastView = { rows:filtered, counts:counts, total:activeTotal, status:statusFilter, from:fFrom, to:fTo,
               search:(document.getElementById('fSearch').value||'').trim(), sort:fSort };

  // 4) view bar (title + back button + export buttons)
  var vb = document.getElementById('viewBar');
  var exportBtns = '<button class="btn-export xl" onclick="exportExcel()" title="Download Excel (.xlsx), A4 portrait">&#11015; Excel</button>'
                 + '<button class="btn-export pdf" onclick="exportPDF()" title="Save as PDF, A4 portrait">&#11015; PDF</button>';
  if(statusFilter){
    var m = STATUS_META[statusFilter];
    var colorVar = {prog:'--blue',del:'--red',hold:'--amber',done:'--green',can:'--muted'}[statusFilter];
    var bgVar    = {prog:'--blue-bg',del:'--red-bg',hold:'--amber-bg',done:'--green-bg',can:'--line2'}[statusFilter];
    vb.innerHTML = '<span class="chip" style="--c:var('+colorVar+');--cbg:var('+bgVar+')">'+m.label+'</span>'
      + '<span class="vtitle">'+filtered.length+' order'+(filtered.length===1?'':'s')+'</span>'
      + '<div class="v-actions">'+(statusFilter==='can'?'':'<button class="back-btn" onclick="setStatusFilter(\'\')">&larr; Back to all orders</button>')+exportBtns+'</div>';
  } else {
    vb.innerHTML = '<span class="vtitle">All Orders</span><span class="muted">'+filtered.length+' record'+(filtered.length===1?'':'s')+'</span>'
      + '<div class="v-actions">'+exportBtns+'</div>';
  }

  // 5) don't wipe a remark the user is typing during the 10-second sync
  var ae = document.activeElement;
  if(ae && ae.tagName==='TEXTAREA' && document.getElementById('tableArea').contains(ae)) return;

  if(filtered.length===0){
    document.getElementById('tableArea').innerHTML = '<div class="empty"><b>No orders found</b>'
      + (statusFilter ? 'There are no '+STATUS_META[statusFilter].label.toLowerCase()+' orders for the current filters.' : 'No orders match the current filters.')
      + '<br><br><button class="back-btn" onclick="clearFilters()">Clear search &amp; dates</button></div>';
    return;
  }

  var html = '<div class="tbl-wrap"><table>';
  var isCan = statusFilter==='can';
  html += isCan
    ? '<thead><tr><th>#</th><th>Party</th><th>Order Date</th><th>Amount</th><th>Region</th><th>Status</th><th>Cancelled By</th><th>Cancelled On</th><th>Cancellation Remark</th></tr></thead><tbody>'
    : '<thead><tr><th>#</th><th>Party</th><th>Order Date</th><th>Amount</th><th>Region</th><th>Status</th><th>Progress</th><th>Current Stage</th><th>Remark</th><th>Action</th></tr></thead><tbody>';

  filtered.forEach(function(o){
    var rowIdx = o.rowIndex, row = o.row;
    var st  = o.st;
    var rmk = remarksMap[rowIdx]||{};
    var party = row[2]||row[1]||row[0]||('Row '+rowIdx);
    var date  = String(row[1]||row[0]||'').split(' ')[0];
    var amt   = row[3];
    var amtTxt = (amt!==''&&amt!=null&&!isNaN(Number(amt))) ? '₹' + Number(amt).toLocaleString('en-IN') : (amt||'');
    var doneCount = 0;
    var dots = STAGES.map(function(sg){
      var s = getStageStatus(row,sg); if(s==='done') doneCount++;
      return '<span class="s-dot '+s+'" title="'+esc(sg.name)+'"></span>';
    }).join('');
    var remarkTxt = (rmk.remark||'').substring(0,34)+(rmk.remark&&rmk.remark.length>34?'…':'');

    html += '<tr class="data-row'+(expandedRow===rowIdx?' open':'')+'" onclick="toggleExpand('+rowIdx+')">';
    html += '<td class="muted">'+rowIdx+'</td>';
    html += '<td class="party">'+esc(party)+'</td>';
    html += '<td class="muted">'+esc(date)+'</td>';
    html += '<td>'+esc(amtTxt)+'</td>';
    html += '<td class="muted">'+esc(row[4]||'')+'</td>';
    html += '<td><span class="badge '+st+'">'+STATUS_META[st].label+'</span></td>';
    var cx = cancelMap[o.key];
    if(isCan && cx){
      html += '<td>'+esc(cx.cancelledBy||'')+'</td>';
      html += '<td class="muted">'+esc((cx.cancelledDate||'')+' '+(cx.cancelledTime||''))+'</td>';
      html += '<td class="muted" style="font-size:.78rem">'+esc((cx.remark||'').substring(0,50)+((cx.remark||'').length>50?'…':''))+'</td>';
    } else {
      html += '<td><div class="prog-cell"><div class="stage-mini">'+dots+'</div><span class="prog-n">'+doneCount+'/'+STAGES.length+'</span></div></td>';
      html += '<td class="stage-now">'+esc(currentStageName(row))+'</td>';
      html += '<td class="muted" style="font-size:.78rem">'+esc(remarkTxt)+'</td>';
      html += '<td><button class="btn-cancel"'+(st==='done'?' disabled title="Completed orders cannot be cancelled" onclick="event.stopPropagation()"':' onclick="event.stopPropagation();openCancel('+rowIdx+')"')+'>Cancel Order</button></td>';
    }
    html += '</tr>';
    html += '<tr class="expand-row" id="exp-'+rowIdx+'" style="display:'+(expandedRow===rowIdx?'':'none')+'"><td colspan="'+(isCan?9:10)+'">'+(isCan?buildCancelHTML(o,cx):buildExpandHTML(rowIdx,row,rmk))+'</td></tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('tableArea').innerHTML = html;
}

// ═══════════════════════════════════════════════════
//  EXPAND ROW
// ═══════════════════════════════════════════════════
function toggleExpand(rowIdx){
  var prev = expandedRow;
  if(prev!==null){
    var old = document.getElementById('exp-'+prev); if(old) old.style.display='none';
    var oldTr = old && old.previousElementSibling; if(oldTr) oldTr.classList.remove('open');
  }
  if(prev===rowIdx){ expandedRow = null; return; }
  expandedRow = rowIdx;
  var el = document.getElementById('exp-'+rowIdx);
  if(el){ el.style.display=''; if(el.previousElementSibling) el.previousElementSibling.classList.add('open'); }
}

function buildExpandHTML(rowIdx, row, rmk){
  var cards = STAGES.map(function(sg){
    var st = getStageStatus(row,sg);
    return '<div class="stage-card '+st+'">'
      +'<div class="s-name">'+esc(sg.name)+'</div>'
      +'<div class="s-who">'+esc(sg.who)+'</div>'
      +'<div class="s-row">Planned <span>'+esc(row[sg.pIdx]||'—')+'</span></div>'
      +'<div class="s-row">Actual <span>'+esc(row[sg.aIdx]||'—')+'</span></div>'
      +'<div class="s-row">Status <span>'+esc(row[sg.sIdx]||'—')+'</span></div>'
      +'</div>';
  }).join('');
  var holdSel = '<select id="hold-'+rowIdx+'">'
    +'<option value=""'+((!rmk.holdStatus)?' selected':'')+'>Active</option>'
    +'<option value="hold"'+(rmk.holdStatus==='hold'?' selected':'')+'>On Hold</option>'
    +'</select>';
  return '<div class="expand-inner" onclick="event.stopPropagation()">'
    +'<div class="stage-list">'+cards+'</div>'
    +'<div class="remark-box">'
    +'<label>Staff remark / hold reason (row '+rowIdx+')</label>'
    +'<textarea id="rmk-'+rowIdx+'" placeholder="Add a note…">'+esc(rmk.remark||'')+'</textarea>'
    +'<div class="remark-footer">'+holdSel
    +'<button class="save-btn" onclick="saveRemark('+rowIdx+')">Save</button>'
    +'<span class="save-ok" id="savok-'+rowIdx+'">✓ Saved</span>'
    +'<button class="btn-cancel" style="margin-left:auto"'+(bucket(getOrderStatus(row,rowIdx))==='done'?' disabled title="Completed orders cannot be cancelled"':' onclick="openCancel('+rowIdx+')"')+'>Cancel Order</button></div>'
    +'</div></div>';
}

var cxTarget = null;

function buildCancelHTML(o, cx){
  cx = cx || {};
  var row = o.row, amt=row[3];
  return '<div class="expand-inner" onclick="event.stopPropagation()">'
    +'<div class="cx-box"><h4>Cancellation details</h4>'
    +'<div class="cx-row"><b>Cancelled by:</b> '+esc(cx.cancelledBy||'—')+'</div>'
    +'<div class="cx-row"><b>Date:</b> '+esc(cx.cancelledDate||'—')+' &nbsp; <b>Time (IST):</b> '+esc(cx.cancelledTime||'—')+'</div>'
    +'<div class="cx-row"><b>Remark:</b></div><div class="cx-remark">'+esc(cx.remark||'—')+'</div></div>'
    +'<div class="cx-box"><h4>Cancellation history</h4>'
    +'<div class="cx-row">&#9679; <b>'+esc((cx.cancelledDate||'')+' '+(cx.cancelledTime||''))+'</b> &mdash; Order cancelled by <b>'+esc(cx.cancelledBy||'—')+'</b>: '+esc(cx.remark||'')+'</div>'
    +'<div class="cx-row muted">Order placed '+esc(String(row[1]||row[0]||'').split(' ')[0])+' &middot; '+esc(row[2]||'')+' &middot; ₹'+esc(amt===''||amt==null||isNaN(Number(amt))?(amt||''):Number(amt).toLocaleString('en-IN'))+'</div></div>'
    +'</div>';
}

function openCancel(rowIdx){
  var o = allOrders.filter(function(x){ return x.rowIndex===rowIdx; })[0];
  if(!o) return;
  if(bucket(getOrderStatus(o.row,o.rowIndex))==='done') return;
  cxTarget = o;
  document.getElementById('cxInfo').innerHTML = 'Party: <b>'+esc(o.row[2]||'')+'</b> (row '+rowIdx+')<br>The order will be marked <b>Cancelled</b> and its full record saved to the Cancelled Orders history. It is not deleted.';
  var nm=''; try{ nm=localStorage.getItem('chr_cancel_by')||''; }catch(e){}
  document.getElementById('cxBy').value = nm;
  document.getElementById('cxRemark').value = '';
  document.getElementById('cxErr').textContent = '';
  document.getElementById('cxYes').disabled = false;
  document.getElementById('cxYes').textContent = 'Yes, cancel order';
  document.getElementById('cxModal').classList.add('show');
  setTimeout(function(){ document.getElementById(nm?'cxRemark':'cxBy').focus(); }, 50);
}
function closeCancel(){ document.getElementById('cxModal').classList.remove('show'); cxTarget=null; }

function cxCall(payload, cb){
  if(IN_GAS){
    google.script.run.withSuccessHandler(function(r){ try{ cb(JSON.parse(r)); }catch(e){ cb({ok:false,error:'Bad response'}); } })
      .withFailureHandler(function(e){ cb({ok:false,error:(e&&e.message)||'Request failed'}); })
      .cancelOrderFromClient(payload);
    return;
  }
  cbIdx++;
  var name='__cxCb'+cbIdx, s=document.createElement('script'), done=false;
  var timer=setTimeout(function(){ if(done) return; done=true; delete window[name]; if(s.parentNode) s.parentNode.removeChild(s); cb({ok:false,error:'Server did not respond. Check your connection and try again.'}); }, 30000);
  window[name]=function(r){ if(done) return; done=true; clearTimeout(timer); delete window[name]; if(s.parentNode) s.parentNode.removeChild(s); cb(r); };
  s.onerror=function(){ if(done) return; done=true; clearTimeout(timer); delete window[name]; if(s.parentNode) s.parentNode.removeChild(s); cb({ok:false,error:'Could not reach the server. Please try again.'}); };
  s.src = scriptUrl + '?action=cancelOrder&cb=' + name + '&data=' + encodeURIComponent(JSON.stringify(payload)) + '&_=' + Date.now();
  document.head.appendChild(s);
}

function confirmCancel(){
  if(!cxTarget) return;
  var by = document.getElementById('cxBy').value.trim();
  var remark = document.getElementById('cxRemark').value.trim();
  var err = document.getElementById('cxErr');
  if(!by){ err.textContent='Please enter your name.'; return; }
  if(!remark){ err.textContent='Cancellation remark is mandatory.'; return; }
  err.textContent='';
  try{ localStorage.setItem('chr_cancel_by', by); }catch(e){}
  var btn = document.getElementById('cxYes'); btn.disabled = true; btn.textContent = 'Cancelling…';
  var o = cxTarget;
  cxCall({ key:o.key, rowIndex:o.rowIndex, cancelledBy:by, remark:remark }, function(r){
    if(r && (r.ok || r.duplicate)){
      var now = new Date();
      localCancel[o.key] = { key:o.key, rowIndex:o.rowIndex, cancelledBy:by, remark:remark,
        cancelledDate: r.cancelledDate || now.toLocaleDateString('en-GB',{timeZone:'Asia/Kolkata'}),
        cancelledTime: r.cancelledTime || now.toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata'}) };
      cancelMap[o.key] = localCancel[o.key];
      closeCancel(); expandedRow = null; renderTable();
      if(r.duplicate) alert('This order was already cancelled.');
    } else {
      btn.disabled = false; btn.textContent = 'Yes, cancel order';
      err.textContent = (r && r.error) || 'Cancellation failed. Please try again.';
    }
  });
}

function stampNow(){ return new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

  });
}

  var t=crc32.t;
  if(!t){ t=crc32.t=[]; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } }

  return (crc^0xFFFFFFFF)>>>0;
}

    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,size,true);
    lh.setUint32(22,size,true); lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nameB,data);

    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,nameB.length,true); ch.setUint32(42,offset,true);

function saveRemark(rowIdx){
  var ta   = document.getElementById('rmk-'+rowIdx);
  var hsel = document.getElementById('hold-'+rowIdx);
  if(!ta) return;
  var remark     = ta.value||'';
  var holdStatus = hsel ? hsel.value : '';
  remarksMap[rowIdx] = { remark: remark, holdStatus: holdStatus };
  updateKPIs();

  var okEl = document.getElementById('savok-'+rowIdx);
  if(okEl){ okEl.style.display='inline'; setTimeout(function(){ okEl.style.display='none'; },2500); }

  if(previewMode || !scriptUrl){
    try{ localStorage.setItem('chr_remarks', JSON.stringify(remarksMap)); }catch(e){}
    return;
  }
  if(IN_GAS){
    google.script.run.saveRemarkFromClient({ rowIndex:rowIdx, remark:remark, holdStatus:holdStatus });
    return;
  }
  fetch(scriptUrl, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'saveRemark', rowIndex:rowIdx, remark:remark, holdStatus:holdStatus })
  }).catch(function(){
    try{ localStorage.setItem('chr_remarks', JSON.stringify(remarksMap)); }catch(e){}
  });
}

// ═══════════════════════════════════════════════════
//  SAMPLE DATA (preview mode)
// ═══════════════════════════════════════════════════
function loadSampleData(){
  var now  = Date.now();
  var fmt  = function(d){ var dt=new Date(d); return pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+'/'+dt.getFullYear()+' '+pad(dt.getHours())+':'+pad(dt.getMinutes())+':'+pad(dt.getSeconds()); };
  var pad  = function(n){ return n<10?'0'+n:String(n); };
  var h    = function(n){ return n*3600000; };

  function makeRow(name, stagesDone, delayed, onHold){
    var row = new Array(47).fill('');
    row[2] = name;
    row[1] = fmt(now - h(stagesDone*5+2)).split(' ')[0];
    row[0] = fmt(now - h(stagesDone*5+2));
    row[3] = String(15000 + stagesDone*4300);
    row[4] = stagesDone%2 ? 'Delhi NCR' : 'Out Side Delhi';
    STAGES.forEach(function(sg, i){
      var p = now - h((STAGES.length-i)*4+1);
      var a = now - h((STAGES.length-i)*3);
      row[sg.pIdx] = fmt(i < stagesDone || (delayed && i===stagesDone) ? p : now + h((i-stagesDone+1)*3));
      if(i < stagesDone){
        row[sg.aIdx] = fmt(a);
        row[sg.sIdx] = 'Done';
      } else if(onHold && i===stagesDone){
        row[sg.sIdx] = 'Hold';
      } else if(delayed && i===stagesDone){
        row[sg.pIdx] = fmt(now - h(2)); // planned in past, no actual = delayed
      }
    });
    return row;
  }

  var sampleRows = [
    {rowIndex:7,  row: makeRow('Sharma Trading Co.',      10, false, false)},
    {rowIndex:8,  row: makeRow('Ravi Electronics',         6, true,  false)},
    {rowIndex:9,  row: makeRow('Delhi Gift House',          4, false, true)},
    {rowIndex:10, row: makeRow('Gupta Brothers',            7, false, false)},
    {rowIndex:11, row: makeRow('Modern Stationers',         3, true,  false)},
    {rowIndex:12, row: makeRow('Anand Traders',             5, false, false)},
  ];

  allOrders = sampleRows;
  remarksMap = { 9: { remark:'Waiting for client confirmation on colour.', holdStatus:'hold' } };
  document.getElementById('syncDot').classList.add('live');
  document.getElementById('syncLbl').textContent = 'Preview Mode';
  document.getElementById('refreshInfo').textContent = 'Sample data — connect URL for live';
  document.getElementById('errBar').style.display = 'none';
  updateKPIs();
  renderTable();
}
