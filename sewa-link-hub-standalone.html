<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sewa Link Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: sticky command bar, colour-coded filter pills, then one tinted bucket per category. */
:root{
  --bg:#f1f3f8;
  --bg-2:#e7eaf2;
  --surface:#ffffff;
  --surface-2:#eef0f6;
  --fg:#141720;
  --fg-dim:#565f73;
  --fg-faint:#88909f;
  --line:#dde1ea;
  --line-strong:#c4cad8;
  --accent:#3457a6;
  --accent-fg:#ffffff;
  --danger:#b3261e;
  --danger-soft:#fbeae8;
  --shadow-s:0 1px 2px rgba(17,24,40,.05), 0 2px 8px rgba(17,24,40,.05);
  --shadow-m:0 6px 18px rgba(17,24,40,.11), 0 2px 5px rgba(17,24,40,.06);
  --tile-l:93%; --tile-bd-l:80%; --ink-l:33%; --band-l:96%; --band-bd-l:86%; --sat:62%;
  --font-ui:"Outfit","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1016; --bg-2:#141821; --surface:#191d27; --surface-2:#232835; --fg:#eef0f6;
  --fg-dim:#a6aec0; --fg-faint:#788194; --line:#2b3140; --line-strong:#3b4356;
  --accent:#7ba3e8; --accent-fg:#0d1017; --danger:#f0a19a; --danger-soft:#30201e;
  --shadow-s:0 1px 2px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  --shadow-m:0 8px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  --tile-l:24%; --tile-bd-l:36%; --ink-l:76%; --band-l:16%; --band-bd-l:28%; --sat:46%;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1016; --bg-2:#141821; --surface:#191d27; --surface-2:#232835; --fg:#eef0f6;
  --fg-dim:#a6aec0; --fg-faint:#788194; --line:#2b3140; --line-strong:#3b4356;
  --accent:#7ba3e8; --accent-fg:#0d1017; --danger:#f0a19a; --danger-soft:#30201e;
  --shadow-s:0 1px 2px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  --shadow-m:0 8px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  --tile-l:24%; --tile-bd-l:36%; --ink-l:76%; --band-l:16%; --band-bd-l:28%; --sat:46%;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- command bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow-s)}
.bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:13px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .glyph{width:36px;height:36px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(140deg,hsl(212 70% 54%),hsl(268 62% 58%));box-shadow:0 3px 10px hsl(230 60% 50% / .32)}
.brand h1{font-family:var(--font-ui);font-weight:700;font-size:20px;letter-spacing:-.015em;margin:0;white-space:nowrap;line-height:1.1}
.brand .sub{display:block;font-size:11.5px;color:var(--fg-faint);font-family:var(--font-mono);letter-spacing:.02em}
.spacer{flex:1 1 auto;min-width:0}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:440px}
.search input{width:100%;padding:10px 34px 10px 38px;background:var(--surface-2);border:1.5px solid transparent;
  border-radius:12px;font-size:14px;transition:border-color .16s, background .16s}
.search input:hover{background:var(--bg-2)}
.search input:focus{background:var(--surface);border-color:var(--accent);outline:none;box-shadow:0 0 0 4px hsl(220 60% 55% / .14)}
.search input::placeholder{color:var(--fg-faint)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--fg-faint);fill:none;stroke-width:2.1;pointer-events:none}
.search .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--fg-faint);
  cursor:pointer;padding:3px 7px;line-height:1;font-size:17px;border-radius:7px}
.search .clr:hover{color:var(--fg);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:11px;border:1.5px solid transparent;
  cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:13.5px;white-space:nowrap;
  transition:transform .14s, box-shadow .16s, background .16s, border-color .16s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(140deg,hsl(214 66% 50%),hsl(248 56% 55%));color:#fff;box-shadow:0 3px 10px hsl(228 60% 48% / .3)}
.btn-primary:hover{box-shadow:0 6px 18px hsl(228 60% 48% / .42);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.96)}
.btn-ghost{background:var(--surface-2);border-color:var(--line);color:var(--fg-dim)}
.btn-ghost:hover{color:var(--fg);border-color:var(--line-strong);background:var(--bg-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- filter pills ---------- */
.rail{background:var(--surface);border-bottom:1px solid var(--line)}
.rail-in{display:flex;gap:8px;overflow-x:auto;padding-block:11px;scrollbar-width:thin}
.rail-in::-webkit-scrollbar{height:6px}
.rail-in::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:hsl(var(--h) var(--sat) var(--band-l));border:1.5px solid hsl(var(--h) var(--sat) var(--band-bd-l));
  color:hsl(var(--h) var(--sat) var(--ink-l));cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font-ui);
  transition:transform .14s, box-shadow .16s, filter .16s}
.chip:hover{transform:translateY(-1px);box-shadow:0 4px 12px hsl(var(--h) 50% 50% / .22)}
.chip:active{transform:scale(.95)}
.chip .em{font-size:14px;line-height:1}
.chip .n{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums;
  background:hsl(var(--h) var(--sat) var(--tile-l));padding:1px 6px;border-radius:999px}
.chip[aria-pressed="true"]{background:hsl(var(--h) var(--sat) 48%);border-color:hsl(var(--h) var(--sat) 48%);
  color:#fff;box-shadow:0 4px 14px hsl(var(--h) 55% 48% / .4)}
.chip[aria-pressed="true"] .n{background:rgba(255,255,255,.22);color:#fff}

/* ---------- buckets ---------- */
main{padding-block:24px 72px}
.sec{margin-bottom:22px;border-radius:18px;overflow:hidden;border:1.5px solid hsl(var(--h) var(--sat) var(--band-bd-l));
  background:var(--surface);box-shadow:var(--shadow-s);scroll-margin-top:130px}
.sec-head{display:flex;align-items:center;gap:11px;padding:13px 16px;
  background:linear-gradient(100deg,hsl(var(--h) var(--sat) var(--band-l)),hsl(var(--h) var(--sat) var(--band-l) / .35));
  border-bottom:1px solid hsl(var(--h) var(--sat) var(--band-bd-l))}
.sec-head .em{width:32px;height:32px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:16px;
  background:hsl(var(--h) var(--sat) var(--tile-l));border:1px solid hsl(var(--h) var(--sat) var(--tile-bd-l))}
.sec-head h2{font-family:var(--font-ui);font-size:14.5px;font-weight:700;letter-spacing:.03em;margin:0;
  color:hsl(var(--h) var(--sat) var(--ink-l));min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-head .n{margin-left:auto;flex:0 0 auto;font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums;
  color:hsl(var(--h) var(--sat) var(--ink-l));background:hsl(var(--h) var(--sat) var(--tile-l));
  border:1px solid hsl(var(--h) var(--sat) var(--tile-bd-l));padding:3px 9px;border-radius:999px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px;padding:14px 16px 16px}
.card{position:relative;display:flex;align-items:flex-start;gap:11px;min-width:0;background:var(--surface);
  border:1.5px solid var(--line);border-radius:13px;padding:12px;
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-m);border-color:hsl(var(--h) var(--sat) var(--tile-bd-l))}
.card:active{transform:translateY(-1px) scale(.99)}
.card .tile{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  background:hsl(var(--h) var(--sat) var(--tile-l));border:1px solid hsl(var(--h) var(--sat) var(--tile-bd-l));
  transition:transform .18s cubic-bezier(.2,.7,.3,1)}
.card:hover .tile{transform:scale(1.09) rotate(-5deg)}
.card .body{flex:1 1 auto;min-width:0}
.card .t{display:block;font-weight:500;font-size:14px;line-height:1.35;text-decoration:none;color:var(--fg);word-break:break-word}
.card:hover .t{color:hsl(var(--h) var(--sat) var(--ink-l))}
.card .t::after{content:"";position:absolute;inset:0;border-radius:13px}
.card .host{display:block;margin-top:4px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tools{position:relative;z-index:1;flex:0 0 auto;display:flex;gap:1px;opacity:0;transform:translateX(4px);
  transition:opacity .16s, transform .16s}
.card:hover .tools,.card:focus-within .tools{opacity:1;transform:none}
@media (hover:none){.card .tools{opacity:1;transform:none}}
.icbtn{background:none;border:0;cursor:pointer;color:var(--fg-faint);padding:5px;border-radius:8px;line-height:0;transition:color .14s, background .14s}
.icbtn:hover{color:var(--fg);background:var(--surface-2)}
.icbtn.del:hover{color:var(--danger);background:var(--danger-soft)}
.icbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card.confirming{border-color:var(--danger);background:var(--danger-soft);transform:none}
.confirm{position:relative;z-index:2;display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.confirm p{margin:0;flex:1 1 auto;min-width:0;font-size:13px;color:var(--danger);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confirm button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;font-family:var(--font-ui);
  cursor:pointer;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);transition:transform .12s}
.confirm button:active{transform:scale(.94)}
.confirm button.yes{background:var(--danger);border-color:var(--danger);color:#fff}

/* ---------- empty / status ---------- */
.state{text-align:center;padding:56px 22px;border:2px dashed var(--line-strong);border-radius:18px;background:var(--surface)}
.state .big{font-size:34px;line-height:1;margin-bottom:12px}
.state h3{font-family:var(--font-ui);font-size:17px;margin:0 0 7px}
.state p{margin:0 auto;max-width:48ch;color:var(--fg-dim);font-size:14px}
.state .btn{margin-top:18px}
.skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.skel i{display:block;height:60px;border-radius:13px;background:var(--surface);border:1.5px solid var(--line);
  animation:pulse 1.5s ease-in-out infinite}
.skel i:nth-child(2){animation-delay:.1s} .skel i:nth-child(3){animation-delay:.2s}
.skel i:nth-child(4){animation-delay:.3s} .skel i:nth-child(5){animation-delay:.4s} .skel i:nth-child(6){animation-delay:.5s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,13,20,.55);backdrop-filter:blur(3px);
  display:grid;place-items:start center;overflow-y:auto;animation:fade .16s ease-out;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:470px;margin-top:6vh;background:var(--surface);border:1.5px solid var(--line-strong);
  border-radius:18px;box-shadow:0 24px 60px rgba(6,9,16,.4);padding:22px;animation:rise .2s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-family:var(--font-ui);font-size:18px;margin:0 0 3px}
.modal .hint{margin:0 0 17px;font-size:13px;color:var(--fg-dim)}
.field{display:block;margin-bottom:13px}
.field span{display:block;font-size:11.5px;font-weight:600;font-family:var(--font-ui);letter-spacing:.05em;
  text-transform:uppercase;color:var(--fg-dim);margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 12px;background:var(--surface-2);border:1.5px solid var(--line);
  border-radius:11px;font-size:14px;transition:border-color .16s, box-shadow .16s}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;background:var(--surface);
  box-shadow:0 0 0 4px hsl(220 60% 55% / .14)}
.err{color:var(--danger);font-size:12.5px;margin:-6px 0 12px;min-height:1px}
.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:6px}
.mlist{display:flex;flex-direction:column;gap:3px;margin-bottom:15px;max-height:52vh;overflow-y:auto}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;min-width:0;transition:background .14s}
.mrow:hover{background:hsl(var(--h) var(--sat) var(--band-l))}
.mrow .em{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:hsl(var(--h) var(--sat) var(--tile-l));border:1px solid hsl(var(--h) var(--sat) var(--tile-bd-l))}
.mname{flex:1 1 auto;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;
  padding:10px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;
  max-height:148px;overflow-y:auto}
.picker button{aspect-ratio:1;display:grid;place-items:center;font-size:19px;line-height:1;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;transition:transform .13s, border-color .15s, box-shadow .15s}
.picker button:hover{transform:translateY(-2px) scale(1.06);border-color:var(--line-strong);box-shadow:var(--shadow-s)}
.picker button:active{transform:scale(.93)}
.picker button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px hsl(220 60% 55% / .2);background:var(--surface)}
.newcat{border:1.5px dashed var(--line-strong);border-radius:13px;padding:13px;margin-bottom:13px;background:var(--surface-2)}
.newcat .field:last-of-type{margin-bottom:0}
.mrow .add{flex:1 1 auto;text-align:left}
.mn{flex:0 0 auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-faint);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-m);animation:pop .22s cubic-bezier(.2,.7,.3,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:620px){
  .bar-in{gap:10px}
  .search{flex-basis:100%;max-width:none;order:3}
  .grid,.skel{grid-template-columns:1fr}
  .brand h1{font-size:18px}
}
</style>

<div class="bar">
  <div class="wrap bar-in">
    <div class="brand">
      <span class="glyph" aria-hidden="true">🔖</span>
      <span><h1>Sewa Link Hub</h1><span class="sub" id="count">—</span></span>
    </div>
    <div class="spacer"></div>
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search by name, category or link…" autocomplete="off" aria-label="Search bookmarks">
      <button class="clr" id="clr" hidden aria-label="Clear search">&times;</button>
    </div>
    <button class="btn btn-ghost" id="manageBtn">⚙️ Categories</button>
    <button class="btn btn-primary" id="addBtn">+ Add link</button>
  </div>
</div>

<div class="rail"><div class="wrap rail-in" id="rail"></div></div>

<main class="wrap">
  <div id="loading" class="skel" aria-live="polite" aria-label="Loading your links">
    <i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <div id="sections" hidden></div>
  <div id="empty" hidden></div>
</main>

<script>
(function(){
  "use strict";

  /* category identity: hue + icon */
  var CAT = {
    "FMS & Workflows":        {h:212, em:"📋"},
    "Google Forms":           {h:276, em:"📝"},
    "IMS & Inventory":        {h:162, em:"📦"},
    "Dashboards & Apps":      {h:26,  em:"📊"},
    "Looker Studio Reports":  {h:194, em:"📈"},
    "Checklists & MIS":       {h:140, em:"✅"},
    "Sales & Customers":      {h:340, em:"🛒"},
    "Finance & Accounts":     {h:44,  em:"💰"},
    "Staff & HR":             {h:300, em:"👥"},
    "Apps Script Projects":   {h:232, em:"⚙️"},
    "Operations & Misc":      {h:184, em:"🗂️"},
    "Reference & Learning":   {h:10,  em:"🎓"}
  };
  var ORDER = ["FMS & Workflows","Google Forms","IMS & Inventory","Dashboards & Apps",
    "Looker Studio Reports","Checklists & MIS","Sales & Customers","Finance & Accounts",
    "Staff & HR","Apps Script Projects","Operations & Misc","Reference & Learning"];
  var KIND_ICON = {sheet:"📗", form:"📝", script:"⚙️", studio:"📈", doc:"📄", web:"🌐"};
  var ICON_CHOICES = ["📋","📝","✅","📊","📦","📈","💰","🛒","👥","⚙️","🗂️","🎓",
    "🚚","🏷️","🧾","🔑","📅","📌","🔔","🏪","🧮","🖥️","📣","🧰","⭐","🔥","💡","🎯"];
  var PALETTE = [212,276,162,26,194,140,340,44,300,232,184,10,120,254,66,320];

  /* category icons and user-made buckets live in one db doc */
  var catMeta = { icons:{}, custom:[] };

  function meta(cat){
    var base = CAT[cat];
    if (!base){
      var h = 0; for (var i=0;i<cat.length;i++) h = (h*31 + cat.charCodeAt(i)) % 360;
      base = { h: PALETTE[Math.abs(h) % PALETTE.length], em:"🔖" };
    }
    var custom = catMeta.icons && catMeta.icons[cat];
    return custom ? { h: base.h, em: custom } : base;
  }
  function iconPicker(id, selected){
    return '<div class="picker" id="' + id + '" role="group" aria-label="Pick an icon">' +
      ICON_CHOICES.map(function(e){
        return '<button type="button" data-em="' + e + '" aria-pressed="' + (e === selected) + '" aria-label="Icon ' + e + '">' + e + '</button>';
      }).join("") + '</div>';
  }
  function wirePicker(scope, id, initial){
    var box = scope.querySelector("#" + id), chosen = { em: initial || ICON_CHOICES[0] };
    box.addEventListener("click", function(e){
      var b = e.target.closest("button[data-em]"); if (!b) return;
      chosen.em = b.getAttribute("data-em");
      [].forEach.call(box.querySelectorAll("button[data-em]"), function(x){
        x.setAttribute("aria-pressed", String(x === b));
      });
    });
    return chosen;
  }
  function saveCatMeta(next){
    if (!db) return Promise.resolve();
    return db.collection("meta").doc("categories").set({
      icons: next.icons || {}, custom: next.custom || []
    });
  }
  function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return String(u).slice(0,40); } }
  function kindOf(u){
    if (u.indexOf("/forms/") > -1) return "form";
    if (u.indexOf("/spreadsheets/") > -1) return "sheet";
    if (u.indexOf("/document/") > -1) return "doc";
    if (u.indexOf("script.google.com") > -1) return "script";
    if (u.indexOf("datastudio.google.com") > -1 || u.indexOf("lookerstudio.google.com") > -1) return "studio";
    return "web";
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var els = {
    q: document.getElementById("q"), clr: document.getElementById("clr"),
    rail: document.getElementById("rail"), sections: document.getElementById("sections"),
    loading: document.getElementById("loading"), empty: document.getElementById("empty"),
    count: document.getElementById("count"), addBtn: document.getElementById("addBtn"),
    manageBtn: document.getElementById("manageBtn")
  };

  var items = [], filter = "all", query = "", db = null, canWrite = null, loaded = false, pendingDel = null;

  /* ---------- rendering ---------- */
  function catsPresent(){
    var seen = {}; items.forEach(function(b){ seen[b.category] = (seen[b.category]||0)+1; });
    var known = ORDER.filter(function(c){ return seen[c]; });
    var extra = Object.keys(seen).filter(function(c){ return ORDER.indexOf(c) === -1; }).sort();
    return { list: known.concat(extra), counts: seen };
  }
  function allCats(){
    var cats = catsPresent().list.slice();
    (catMeta.custom || []).forEach(function(c){ if (cats.indexOf(c) === -1) cats.push(c); });
    ORDER.forEach(function(c){ if (cats.indexOf(c) === -1) cats.push(c); });
    return cats;
  }
  function matches(b){
    if (filter !== "all" && b.category !== filter) return false;
    if (!query) return true;
    return (b.title + " " + b.category + " " + b.url).toLowerCase().indexOf(query) > -1;
  }

  function renderRail(){
    var c = catsPresent(), html = "";
    html += '<button class="chip" style="--h:220" data-cat="all" aria-pressed="' + (filter==="all") + '">' +
            '<span class="em">🗃️</span>All links <span class="n">' + items.length + '</span></button>';
    c.list.forEach(function(cat){
      var m = meta(cat);
      html += '<button class="chip" style="--h:' + m.h + '" data-cat="' + esc(cat) + '" aria-pressed="' + (filter===cat) + '">' +
              '<span class="em">' + m.em + '</span>' + esc(cat) + ' <span class="n">' + c.counts[cat] + '</span></button>';
    });
    els.rail.innerHTML = html;
  }

  function cardHTML(b){
    if (pendingDel === b.id){
      return '<div class="card confirming" data-id="' + esc(b.id) + '"><div class="confirm">' +
        '<p>Remove &ldquo;' + esc(b.title) + '&rdquo;?</p>' +
        '<button class="yes" data-act="yes">Remove</button>' +
        '<button data-act="no">Keep</button></div></div>';
    }
    var m = meta(b.category);
    return '<div class="card" style="--h:' + m.h + '" data-id="' + esc(b.id) + '">' +
      '<span class="tile" aria-hidden="true">' + (KIND_ICON[b.kind] || "🌐") + '</span>' +
      '<span class="body"><a class="t" href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer">' + esc(b.title) + '</a>' +
      '<span class="host">' + esc(hostOf(b.url)) + '</span></span>' +
      '<span class="tools">' +
        '<button class="icbtn" data-act="copy" title="Copy link" aria-label="Copy link to ' + esc(b.title) + '">' +
          '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>' +
        (canWrite === false ? "" :
        '<button class="icbtn" data-act="edit" title="Edit" aria-label="Edit ' + esc(b.title) + '">' +
          '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"></path><path d="M14.5 7.5l2 2"></path></svg></button>' +
        '<button class="icbtn del" data-act="del" title="Remove" aria-label="Remove ' + esc(b.title) + '">' +
          '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg></button>') +
      '</span></div>';
  }

  function render(){
    els.loading.hidden = loaded;
    if (!loaded) return;

    var cp = catsPresent();
    els.count.textContent = items.length + (items.length === 1 ? " link · " : " links · ") +
                            cp.list.length + (cp.list.length === 1 ? " bucket" : " buckets");
    renderRail();

    var shown = items.filter(matches);

    if (!items.length){
      els.sections.hidden = true; els.empty.hidden = false;
      els.empty.innerHTML = '<div class="state"><div class="big">🔖</div><h3>No links saved yet</h3>' +
        '<p>Add your first bookmark and it will be filed under the category you pick. Everything you add stays here next time you open this page.</p>' +
        (canWrite === false ? "" : '<button class="btn btn-primary" data-act="open-add">+ Add your first link</button>') + '</div>';
      return;
    }
    if (!shown.length){
      els.sections.hidden = true; els.empty.hidden = false;
      els.empty.innerHTML = '<div class="state"><div class="big">🔍</div><h3>Nothing matches that</h3>' +
        '<p>No link in ' + (filter === "all" ? "your collection" : esc(filter)) + ' matches &ldquo;' + esc(els.q.value) + '&rdquo;. Try a shorter word, or clear the filter.</p>' +
        '<button class="btn btn-ghost" data-act="reset">Show all links</button></div>';
      return;
    }
    els.empty.hidden = true; els.sections.hidden = false;

    var groups = {}, order = [];
    shown.forEach(function(b){
      if (!groups[b.category]){ groups[b.category] = []; order.push(b.category); }
      groups[b.category].push(b);
    });
    order.sort(function(a,b){
      var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1; if (ib === -1) return -1;
      return ia - ib;
    });

    var html = "";
    order.forEach(function(cat){
      var m = meta(cat);
      var list = groups[cat].slice().sort(function(a,b){ return a.title.localeCompare(b.title, undefined, {numeric:true}); });
      html += '<section class="sec" style="--h:' + m.h + '">' +
        '<div class="sec-head"><span class="em" aria-hidden="true">' + m.em + '</span>' +
        '<h2>' + esc(cat) + '</h2><span class="n">' + list.length + '</span></div>' +
        '<div class="grid">' + list.map(cardHTML).join("") + '</div></section>';
    });
    els.sections.innerHTML = html;
  }

  /* ---------- interaction ---------- */
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2300);
  }

  els.q.addEventListener("input", function(){
    query = els.q.value.trim().toLowerCase();
    els.clr.hidden = !els.q.value;
    pendingDel = null;
    render();
  });
  els.clr.addEventListener("click", function(){
    els.q.value = ""; query = ""; els.clr.hidden = true; els.q.focus(); render();
  });
  els.rail.addEventListener("click", function(e){
    var c = e.target.closest(".chip"); if (!c) return;
    filter = c.getAttribute("data-cat"); pendingDel = null; render();
    var top = document.getElementById("sections");
    if (filter !== "all" && top) window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "reset"){ filter = "all"; els.q.value = ""; query = ""; els.clr.hidden = true; render(); return; }
    if (act === "open-add"){ openForm(null); return; }
    var card = b.closest(".card"); if (!card) return;
    var id = card.getAttribute("data-id");
    var item = items.filter(function(x){ return x.id === id; })[0];
    if (act === "copy" && item){
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(item.url).then(function(){ toast("Link copied"); },
          function(){ selectText(card); toast("Press Ctrl+C to copy"); });
      } else { selectText(card); toast("Press Ctrl+C to copy"); }
    }
    if (act === "edit" && item){ openForm(item); return; }
    if (act === "del"){ pendingDel = id; render(); }
    if (act === "no"){ pendingDel = null; render(); }
    if (act === "yes" && item) remove(item);
  });
  function selectText(card){
    var a = card.querySelector(".t"); if (!a) return;
    var r = document.createRange(); r.selectNodeContents(a);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  /* ---------- modal shell ---------- */
  function modal(html){
    var ov = document.createElement("div");
    ov.className = "ov";
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(ov);
    function close(){ ov.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    ov.addEventListener("click", function(e){
      if (e.target === ov || (e.target.hasAttribute && e.target.hasAttribute("data-close"))) close();
    });
    return { el: ov, close: close };
  }

  /* ---------- add / edit link ---------- */
  function openForm(existing){
    if (canWrite === false){ toast("You have view-only access"); return; }
    var cats = allCats();
    if (existing && cats.indexOf(existing.category) === -1) cats.unshift(existing.category);
    var m = modal(
      '<h2>' + (existing ? "✏️ Edit link" : "➕ Add a link") + '</h2>' +
      '<p class="hint">' + (existing ? "Change the name, the address, or which bucket it sits in." : "It will appear under the category you choose.") + '</p>' +
      '<label class="field"><span>Name</span><input id="f-title" type="text" placeholder="Purchase Inward FMS" autocomplete="off" value="' + (existing ? esc(existing.title) : "") + '"></label>' +
      '<label class="field"><span>Link</span><input id="f-url" type="url" placeholder="https://…" autocomplete="off" inputmode="url" value="' + (existing ? esc(existing.url) : "") + '"></label>' +
      '<label class="field"><span>Category</span><select id="f-cat">' +
        cats.map(function(c){ return '<option value="' + esc(c) + '">' + meta(c).em + "  " + esc(c) + '</option>'; }).join("") +
        '<option value="__new">➕  New category…</option></select></label>' +
      '<div class="newcat" id="f-newwrap" hidden>' +
        '<label class="field"><span>New category name</span><input id="f-new" type="text" placeholder="Vendor Portals" autocomplete="off"></label>' +
        '<label class="field"><span>Pick its icon</span></label>' + iconPicker("f-pick", "🔖") +
      '</div>' +
      '<p class="err" id="f-err"></p>' +
      '<div class="actions"><button class="btn btn-ghost" data-close>Cancel</button>' +
      '<button class="btn btn-primary" id="f-save">' + (existing ? "Save changes" : "Save link") + '</button></div>');

    var ov = m.el, sel = ov.querySelector("#f-cat"), newWrap = ov.querySelector("#f-newwrap"),
        err = ov.querySelector("#f-err"), save = ov.querySelector("#f-save");
    var pick = wirePicker(ov, "f-pick", "🔖");
    if (existing) sel.value = existing.category;
    else if (filter !== "all" && cats.indexOf(filter) > -1) sel.value = filter;
    ov.querySelector("#f-title").focus();

    sel.addEventListener("change", function(){
      newWrap.hidden = sel.value !== "__new";
      if (!newWrap.hidden) ov.querySelector("#f-new").focus();
    });
    ov.addEventListener("keydown", function(e){
      if (e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); save.click(); }
    });

    save.addEventListener("click", function(){
      var title = ov.querySelector("#f-title").value.trim();
      var url = ov.querySelector("#f-url").value.trim();
      var isNew = sel.value === "__new";
      var cat = isNew ? ov.querySelector("#f-new").value.trim() : sel.value;
      if (!title){ err.textContent = "Give the link a name so you can find it later."; return; }
      if (!url){ err.textContent = "Paste the link address."; return; }
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      try { new URL(url); } catch(e2){ err.textContent = "That address isn't a valid link."; return; }
      if (!cat){ err.textContent = "Name the new category."; return; }
      save.disabled = true; err.textContent = "";
      var rec = { title: title, url: url, category: cat, kind: kindOf(url),
                  createdAt: existing ? (existing.createdAt || Date.now()) : Date.now() };
      var first = isNew ? registerCat(cat, pick.em) : Promise.resolve();
      var p = first.then(function(){
        return existing ? db.collection("bookmarks").doc(existing.id).set(rec) : add(rec);
      });
      p.then(function(){ m.close(); toast(existing ? "Updated" : "Saved to " + cat); })
       .catch(function(e3){
          save.disabled = false;
          err.textContent = e3 && e3.code === "invalid_argument"
            ? "You don't have permission to change links here."
            : "Couldn't save that link. Try again in a moment.";
       });
    });
  }
  els.addBtn.addEventListener("click", function(){ openForm(null); });

  /* ---------- manage categories ---------- */
  function registerCat(name, em){
    var next = { icons: {}, custom: (catMeta.custom || []).slice() };
    Object.keys(catMeta.icons || {}).forEach(function(k){ next.icons[k] = catMeta.icons[k]; });
    if (em) next.icons[name] = em;
    if (next.custom.indexOf(name) === -1 && ORDER.indexOf(name) === -1) next.custom.push(name);
    return saveCatMeta(next);
  }

  function openManage(){
    var c = catsPresent();
    var known = allCats().filter(function(x){ return c.counts[x] || (catMeta.custom || []).indexOf(x) > -1; });
    if (!known.length){ toast("Add a link first"); return; }
    var rows = known.map(function(cat){
      var m = meta(cat);
      return '<div class="mrow" style="--h:' + m.h + '">' +
        '<span class="em" aria-hidden="true">' + m.em + '</span>' +
        '<span class="mname">' + esc(cat) + '</span>' +
        '<span class="mn">' + (c.counts[cat] || 0) + '</span>' +
        (canWrite === false ? "" :
          '<button class="icbtn" data-mact="rename" data-cat="' + esc(cat) + '" title="Rename" aria-label="Rename ' + esc(cat) + '">' +
            '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"></path><path d="M14.5 7.5l2 2"></path></svg></button>' +
          '<button class="icbtn" data-mact="merge" data-cat="' + esc(cat) + '" title="Move links elsewhere" aria-label="Move links out of ' + esc(cat) + '">' +
            '<svg viewBox="0 0 24 24"><path d="M5 12h12"></path><path d="M13 7l5 5-5 5"></path></svg></button>') +
      '</div>';
    }).join("");

    var m = modal('<h2>⚙️ Categories</h2>' +
      '<p class="hint">Rename a bucket, or move all of its links into another one. A bucket disappears once nothing is in it.</p>' +
      '<div class="mlist">' + rows + '</div>' +
      '<div class="actions">' +
      (canWrite === false ? "" : '<button class="btn btn-ghost" data-mact="create" style="margin-right:auto">➕ New category</button>') +
      '<button class="btn btn-ghost" data-close>Done</button></div>');

    m.el.addEventListener("click", function(e){
      var b = e.target.closest("[data-mact]"); if (!b) return;
      var act = b.getAttribute("data-mact"), cat = b.getAttribute("data-cat");
      m.close();
      if (act === "create") openCreateCat();
      else if (act === "rename") openRename(cat);
      else openMerge(cat);
    });
  }
  els.manageBtn.addEventListener("click", openManage);

  function openCreateCat(){
    var m = modal('<h2>➕ New category</h2>' +
      '<p class="hint">Name the bucket and give it an icon. It shows up straight away when you add or edit a link.</p>' +
      '<label class="field"><span>Category name</span><input id="c-name" type="text" placeholder="Vendor Portals" autocomplete="off"></label>' +
      '<label class="field"><span>Pick its icon</span></label>' + iconPicker("c-pick", "🔖") +
      '<p class="err" id="c-err" style="margin-top:12px"></p>' +
      '<div class="actions"><button class="btn btn-ghost" data-close>Cancel</button>' +
      '<button class="btn btn-primary" id="c-save">Create category</button></div>');
    var input = m.el.querySelector("#c-name"), err = m.el.querySelector("#c-err"),
        save = m.el.querySelector("#c-save"), pick = wirePicker(m.el, "c-pick", "🔖");
    input.focus();
    m.el.addEventListener("keydown", function(e){
      if (e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); save.click(); }
    });
    save.addEventListener("click", function(){
      var name = input.value.trim();
      if (!name){ err.textContent = "Give the category a name."; return; }
      if (allCats().indexOf(name) > -1){ err.textContent = "You already have a category with that name."; return; }
      save.disabled = true; err.textContent = "";
      registerCat(name, pick.em).then(function(){
        m.close(); toast(pick.em + "  " + name + " created");
      }).catch(function(){ save.disabled = false; err.textContent = "Couldn't create that category. Try again."; });
    });
  }

  function openRename(cat){
    var cur = meta(cat).em;
    var m = modal('<h2>Rename category</h2>' +
      '<p class="hint">Every link in &ldquo;' + esc(cat) + '&rdquo; moves to the new name.</p>' +
      '<label class="field"><span>New name</span><input id="r-name" type="text" autocomplete="off" value="' + esc(cat) + '"></label>' +
      '<label class="field"><span>Its icon</span></label>' + iconPicker("r-pick", cur) +
      '<p class="err" id="r-err" style="margin-top:12px"></p>' +
      '<div class="actions"><button class="btn btn-ghost" data-close>Cancel</button>' +
      '<button class="btn btn-primary" id="r-save">Save</button></div>');
    var input = m.el.querySelector("#r-name"), err = m.el.querySelector("#r-err"),
        save = m.el.querySelector("#r-save"), pick = wirePicker(m.el, "r-pick", cur);
    input.focus(); input.select();
    m.el.addEventListener("keydown", function(e){
      if (e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); save.click(); }
    });
    save.addEventListener("click", function(){
      var name = input.value.trim();
      if (!name){ err.textContent = "Give the category a name."; return; }
      save.disabled = true; err.textContent = "";
      var next = { icons: {}, custom: (catMeta.custom || []).filter(function(x){ return x !== cat; }) };
      Object.keys(catMeta.icons || {}).forEach(function(k){ if (k !== cat) next.icons[k] = catMeta.icons[k]; });
      next.icons[name] = pick.em;
      if (next.custom.indexOf(name) === -1 && ORDER.indexOf(name) === -1) next.custom.push(name);
      saveCatMeta(next)
        .then(function(){ return name === cat ? 0 : moveAll(cat, name); })
        .then(function(n){
          m.close();
          if (filter === cat) filter = name;
          render();
          toast(name === cat ? "Icon updated" : "Renamed — " + n + (n === 1 ? " link moved" : " links moved"));
        })
        .catch(function(){ save.disabled = false; err.textContent = "Couldn't save that category. Try again."; });
    });
  }

  function openMerge(cat){
    var others = catsPresent().list.filter(function(x){ return x !== cat; });
    if (!others.length){ toast("There's no other category to move them into"); return; }
    var m = modal('<h2>Move links out of ' + esc(cat) + '</h2>' +
      '<p class="hint">All of its links go to the category you pick, and &ldquo;' + esc(cat) + '&rdquo; disappears.</p>' +
      '<label class="field"><span>Move into</span><select id="g-cat">' +
        others.map(function(x){ return '<option value="' + esc(x) + '">' + meta(x).em + "  " + esc(x) + '</option>'; }).join("") +
        '</select></label>' +
      '<p class="err" id="g-err"></p>' +
      '<div class="actions"><button class="btn btn-ghost" data-close>Cancel</button>' +
      '<button class="btn btn-primary" id="g-save">Move links</button></div>');
    var sel = m.el.querySelector("#g-cat"), err = m.el.querySelector("#g-err"), save = m.el.querySelector("#g-save");
    save.addEventListener("click", function(){
      save.disabled = true; err.textContent = "";
      var target = sel.value;
      moveAll(cat, target).then(function(n){
        m.close();
        if (filter === cat) filter = target;
        toast(n + (n === 1 ? " link moved to " : " links moved to ") + target);
      }).catch(function(){ save.disabled = false; err.textContent = "Couldn't move those links. Try again."; });
    });
  }

  function moveAll(from, to){
    var list = items.filter(function(b){ return b.category === from; });
    return Promise.all(list.map(function(b){
      return db.collection("bookmarks").doc(b.id).update({ category: to });
    })).then(function(){ return list.length; });

  var KEY = "sewaLinkHub.v1";

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.items)) return s;
      }
    } catch(e){}
    return null;
  }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, meta: catMeta })); }
    catch(e){ toast("This browser won't save changes"); }
  }
  function byId(id){ for (var i=0;i<items.length;i++) if (items[i].id === id) return i; return -1; }

  function newId(){ return "bm_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }
  function add(rec){ return db.collection("bookmarks").doc(newId()).set(rec); }
  function remove(item){
    pendingDel = null;
    db.collection("bookmarks").doc(item.id).delete().then(function(){ toast("Removed"); });
  }

  /* a tiny stand-in for the hosted store, so the rest of the page is unchanged */
  db = {
    collection: function(name){
      return { doc: function(id){
        return {
          set: function(data){
            if (name === "meta"){
              catMeta = { icons: data.icons || {}, custom: data.custom || [] };
            } else {
              var i = byId(id);
              var rec = { id: id, title: data.title, url: data.url, category: data.category,
                          kind: data.kind, createdAt: data.createdAt };
              if (i > -1) items[i] = rec; else items.push(rec);
            }
            persist(); render();
            return Promise.resolve();
          },
          update: function(patch){
            var i = byId(id);
            if (i > -1){ for (var k in patch) items[i][k] = patch[k]; }
            persist(); render();
            return Promise.resolve();
          },
          delete: function(){
            var i = byId(id);
            if (i > -1) items.splice(i, 1);
            persist(); render();
            return Promise.resolve();
          }
        };
      }};
    }
  };

  function resetToOriginal(){
    items = SEED.map(function(b){ return JSON.parse(JSON.stringify(b)); });
    catMeta = { icons:{}, custom:[] };
    persist(); render();
    toast("Restored all " + items.length + " original links");
  }
  window.sewaResetLinks = resetToOriginal;

  function boot(){
    var saved = load();
    items = saved ? saved.items : SEED.map(function(b){ return JSON.parse(JSON.stringify(b)); });
    if (saved && saved.meta) catMeta = { icons: saved.meta.icons || {}, custom: saved.meta.custom || [] };
    canWrite = true;
    loaded = true;
    if (!saved) persist();
    render();
  }
  boot();
})();
