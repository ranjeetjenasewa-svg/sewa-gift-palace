<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christofin Impex — Outstanding Dashboard</title>
<style>
  html,body{margin:0;height:100%;background:#f0f2f5;font-family:'Segoe UI',sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #open{position:fixed;right:10px;bottom:10px;z-index:10;background:#1a237e;color:#fff;text-decoration:none;
    font-size:12px;padding:6px 12px;border-radius:6px;opacity:.85}
  #open:hover{opacity:1}
</style>
</head>
<body>
<iframe id="app" title="Christofin Outstanding Dashboard" allow="clipboard-write"></iframe>
<a id="open" target="_blank" rel="noopener">Open in new tab ↗</a>
<script>
  // Your Apps Script web-app URL (Deploy → Manage deployments → Web app URL, ends with /exec)
  var APP_URL = 'https:' + '\x2f\x2f' + 'script.google.com/macros/s/AKfycbyZ3zn5ZcqSzGrGCsHBc6bR2KFp1UQ8chy69zXtBF7s2uNnMVw-nH_hL0byYmLSWxe62w/exec';
  document.getElementById('app').src = APP_URL;
  document.getElementById('open').href = APP_URL;
</script>
</body>
</html>
