<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christofin Impex — Outstanding Dashboard</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#222}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12);padding:36px 40px;text-align:center;max-width:380px}
  h1{font-size:20px;margin:0 0 6px;color:#1a237e}
  p{font-size:13px;color:#666;margin:0 0 22px}
  a.btn{display:inline-block;background:#1a237e;color:#fff;text-decoration:none;padding:11px 26px;border-radius:8px;font-weight:600}
  small{display:block;margin-top:16px;color:#999;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <h1>Christofin Impex</h1>
  <p>Outstanding Payment Dashboard</p>
  <a class="btn" id="go" href="#">Open Dashboard</a>
  <small>Opening automatically…</small>
</div>
<script>
  // Paste your Apps Script web-app URL here (Deploy → Manage deployments → Web app URL, ends with /exec)
  var APP_URL = 'https:' + '\x2f\x2f' + 'script.google.com/macros/s/AKfycbyZ3zn5ZcqSzGrGCsHBc6bR2KFp1UQ8chy69zXtBF7s2uNnMVw-nH_hL0byYmLYSWxe62w/exec';
  document.getElementById('go').href = APP_URL;
  if (APP_URL.indexOf('PASTE_YOUR') === -1) { setTimeout(function(){ location.replace(APP_URL); }, 800); }
  else { document.querySelector('small').textContent = 'Set APP_URL in index.html first.'; }
</script>
</body>
</html>
